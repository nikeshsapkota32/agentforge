title = "AgentForge gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Allow example placeholders and generated lockfiles"
paths = [
  '''.env.example''',
  '''backend/.env.example''',
  '''.+/package-lock\.json''',
]
regexes = [
  '''sk-\.\.\.''',
  '''postgres:postgres''',
]
