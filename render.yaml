# Render blueprint — provisions the backend as a free-tier web service.
# Database (Neon), Redis (Upstash), and LLM (Groq) live outside Render on
# their own free tiers. Set the URL + key env vars in the Render dashboard
# after the first deploy.
#
# Deploy: connect this repo to Render, choose "New Blueprint", point at this
# file, then fill in the env vars marked `sync: false` below.

services:
  - type: web
    name: agentforge-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: API_V1_PREFIX
        value: /api/v1

      # CORS — set to your Vercel URL once deployed.
      - key: CORS_ORIGINS
        sync: false

      # Postgres (Neon free tier).  Format:
      # postgresql+asyncpg://user:pass@host/db?ssl=require
      - key: DATABASE_URL
        sync: false

      # Redis (Upstash free tier).  Use the rediss:// (TLS) URL.
      - key: REDIS_URL
        sync: false

      # LLM — Groq is free with Llama 3.3 70B.
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile

      # Embeddings — disable when not paying for OpenAI.
      # Vector tools will return {disabled: ...} instead of failing.
      - key: EMBEDDINGS_PROVIDER
        value: disabled

      # JWT keys — paste the PEM contents (newlines as \n).
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false

      # Optional integrations.
      - key: PINECONE_API_KEY
        value: ""
      - key: LANGSMITH_TRACING
        value: "false"
      - key: SERPAPI_API_KEY
        value: ""

      - key: MAX_CRITIC_LOOPS
        value: "2"
      - key: MIN_PASSING_SCORE
        value: "7"
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
